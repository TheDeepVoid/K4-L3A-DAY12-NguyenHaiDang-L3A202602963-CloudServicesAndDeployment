# BONUS — CI/CD với GitHub Actions
#
# Mỗi lần push hoặc mở pull request, GitHub chạy trên một máy ảo sạch:
# cài dependency -> chạy test -> build Docker image -> và CHỈ khi tất cả
# xanh thì mới deploy lên Render.
#
# Không có workflow này thì "quên chạy test trước khi deploy" và "máy tôi
# build được" vẫn là hai sự cố không ai chặn được.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Bấm "Re-run all jobs" thi mới cho chạy lai workflow da fail.
permissions:
  contents: read

# Job nao that bai thi huy ca workflow — dung vi deploy job da co `needs`
# nen no cung khong chay, nhung cancel job dang cho ton tai la thoi.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. TEST — chạy checkpoint trên máy sạch
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test (CP1-CP4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Settings bat buoc co AGENT_API_KEY ma may CI khong co file .env.
      # Day chinh la loi ich cua 12-Factor: cung mot code, moi truong khac
      # nhau chi khac bien moi truong. Gia tri o day la gia tri gia.
      #
      # `--ignore=tests/test_cp5.py`: file nay goi vao ban da deploy that
      # tren Internet, chay trong CI se luon do (hoac mat hang chuc giay
      # cho mang). `--ignore=tests/test_bonus_cicd.py`: no kiem tra badge
      # cua chinh workflow nay — chay o day la tu tham chieu vong tron.
      # `-m "not docker"` bo qua test build image (job build ben duoi
      # lo phan do).
      - name: Chạy test
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: |
          pytest tests/ -v -m "not docker" \
            --ignore=tests/test_cp5.py \
            --ignore=tests/test_bonus_cicd.py

  # ─────────────────────────────────────────────────────────────
  # 2. BUILD — build image tren may sach
  # ─────────────────────────────────────────────────────────────
  # Bat file nao chi co tren may cua toi, hay .dockerignore loai nham
  # thu can thiet, deu bi bat o day thay vi tai luc deploy.
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:ci .

      - name: Kiểm tra image chạy được và nhỏ đủ
        run: |
          SIZE=$(docker images day12-agent:ci --format '{{.Size}}')
          echo "image size: $SIZE"
          MB=$(echo "$SIZE" | sed 's/MB//')
          # So sanh voi tran 500MB cua CP2
          awk -v mb="$MB" 'BEGIN { exit (mb < 500) ? 0 : 1 }' || {
            echo "::error::image $SIZE lon hon 500MB"
            exit 1
          }

      # Chay container that voi mot API key gia va Redis gia, roi goi
      # /health tu trong no. Day la bang chung image build duoc thi
      # CHAY duoc, khong phai chi build duoc.
      - name: Smoke test container
        run: |
          docker run -d --name agent-ci -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy \
            -e REDIS_URL=fake:// \
            day12-agent:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then
              echo ""
              echo "container healthy"
              docker rm -f agent-ci
              exit 0
            fi
            sleep 2
          done
          echo "::error::container khong phan hoi /health trong 40s"
          docker logs agent-ci
          docker rm -f agent-ci
          exit 1

  # ─────────────────────────────────────────────────────────────
  # 3. DEPLOY — chi chay khi test VA build deu xanh
  # ─────────────────────────────────────────────────────────────
  # `needs:` la thu bien "song song" thanh "day xich": job nay doi
  # `test` va `build` xong VA PASS. Thieu no, GitHub chay deploy cung
  # luc voi test, va code hong van len production trong khi test dang do.
  deploy:
    name: Deploy len Render
    runs-on: ubuntu-latest

    needs: [test, build]

    # Chi deploy tu nhanh main va chi khi day la push.
    # Thieu `if:`, moi lan ai do mo pull request la mot lan deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Render deploy bang cach PATCH service sang commit moi. Token lay
      # tu GitHub Secrets (Settings -> Secrets and variables -> Actions),
      # KHONG bao gio dan truc tiep vao file YAML nay: YAML nam trong
      # lich su git vinh vien, xoa o commit sau khong lam no bien mat.
      - name: Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ vars.RENDER_DEPLOY_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::warning::chua set RENDER_API_KEY, bo qua deploy"
            exit 0
          fi
          # clearCache=do_not_clear: KHONG xoa cache. Render danh dau
          # deploy "live" va khong chay lai build neu khong doi gi.
          curl -fsS -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":\"do_not_clear\",\"commitId\":\"${{ github.sha }}\"}"
          echo "da trigger deploy $RENDER_DEPLOY_ID"

      # Deploy xong ma khong kiem tra thi chi biet "lenh deploy chay xong",
      # khong biet "service con song". curl -f tra loi khi HTTP khong phai
      # 2xx -> job do -> biet ngay.
      - name: Smoke test ban da deploy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.PUBLIC_URL }}/health"; then
              echo ""
              echo "deploy thanh cong"
              exit 0
            fi
            sleep 10
          done
          echo "::error::khong goi duoc ${{ vars.PUBLIC_URL }}/health sau 5 phut"
          exit 1
