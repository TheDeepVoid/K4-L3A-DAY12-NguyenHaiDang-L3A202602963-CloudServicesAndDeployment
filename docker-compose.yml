# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: agent + redis (+ nginx nếu làm phần mở rộng)
#
# Chạy Redis riêng từ Block 1 để có Redis mà code:
#     docker compose up -d redis
#
# Chạy cả stack (sau khi đã điền AGENT_API_KEY trong .env):
#     docker compose up -d
#     curl http://localhost:8000/health
#
# MỞ RỘNG TïY CHỌN: thêm service `nginx` làm load balancer
# (không phải bonus chấm điểm riêng; nginx/nginx.conf đã có sẵn)
#     docker compose up --scale agent=3
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build: .
    # Dải cổng, KHÔNG phải một cổng cố định.
    #
    # LAB_GUIDE.md §Block 4 và câu 9 của exercises.md đều bảo chạy
    # `docker compose up -d --scale agent=3`. Nếu map cứng `8000:8000` thì cả
    # 3 replica đều muốn chiếm cổng 8000 của host và lệnh đó chết ngay:
    #   Bind for 0.0.0.0:8000 failed: port is already allocated
    # Docker cấp phát cổng host từ TRONG dải, nên chạy 1 instance vẫn ra
    # 8000 đúng như cũ, chạy 3 instance thì lấy 8000, 8001, 8002.
    #
    # Muốn biết instance nào ở cổng nào: `docker compose ps`, rồi
    # curl http://localhost:8002/health v.v.
    ports:
      - "8000-8002:8000"
    # depends_on + condition: service_started ở mức tối thiểu. Không dùng
    # `condition: service_healthy` vì nó làm `docker compose up` phải chờ
    # Redis healthy rồi mới khởi động agent — cần thiết khi deploy có
    # orchestrator thật, nhưng ở máy thì thừa. App vẫn chịu được lúc
    # Redis chưa sẵn sàng vì /ready trả 503 thay vì crash.
    depends_on:
      redis:
        condition: service_started
    environment:
      # Nội suy biến: docker compose tự đọc từ file .env cùng thư mục.
      # TUYỆT ĐỐI không viết thẳng khóa vào file này — repo này được
      # commit, `.env` thì không.
      AGENT_API_KEY: ${AGENT_API_KEY}
      # `redis` là TÊN SERVICE, cũng chính là hostname trong mạng nội bộ
      # của compose. Ghi `localhost` ở đây là sai kinh điển: bên trong
      # container, localhost là chính container agent, không phải Redis.
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 30s
      timeout: 5s
      # start_period cho uvicorn thời gian nạp app trước khi probe bắt
      # đầu đếm fail — nếu không, container bị đánh dấu unhealthy lúc mới
      # khởi động dù app hoàn toàn ổn.
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
